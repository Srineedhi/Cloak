
<style>
/* HYDRONEXUS — modern interface enhancement */
:root {
  color-scheme: dark;
  --hx-bg: #080d18;
  --hx-panel: #111827;
  --hx-border: #293548;
  --hx-text: #e5edf8;
  --hx-muted: #94a3b8;
  --hx-accent: #22d3ee;
  --hx-green: #34d399;
}

html {
  scroll-behavior: smooth;
}

body {
  background:
    radial-gradient(ellipse at 15% 0%, #123044 0%, transparent 42%),
    var(--hx-bg) !important;
  color: var(--hx-text);
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  line-height: 1.6;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
  transition:
    transform 160ms ease,
    border-color 160ms ease,
    background-color 160ms ease,
    box-shadow 160ms ease;
}

button:hover {
  border-color: var(--hx-accent);
  box-shadow: 0 0 16px #22d3ee18;
}

button:active {
  transform: scale(0.985);
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--hx-accent);
  outline-offset: 3px;
}

input,
select,
textarea {
  max-width: 100%;
  background: #0b1220;
  color: var(--hx-text);
  border: 1px solid var(--hx-border);
  border-radius: 10px;
  padding: 10px 12px;
}

input::placeholder,
textarea::placeholder {
  color: #64748b;
}

#viewMainGate {
  animation: hx-enter 350ms ease-out both;
}

#viewMainGate > div,
#viewMainGate section,
#viewMainGate article {
  transition: border-color 180ms ease, box-shadow 180ms ease;
}

#viewMainGate > div:hover,
#viewMainGate section:hover,
#viewMainGate article:hover {
  border-color: #3b526c;
}

a {
  color: var(--hx-accent);
  text-underline-offset: 3px;
}

a:hover {
  color: #a5f3fc;
}

::selection {
  background: #155e75;
  color: white;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: #080d18;
}

::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
  background: #64748b;
}

@keyframes hx-enter {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (max-width: 640px) {
  body {
    overflow-wrap: anywhere;
  }

  input,
  select,
  textarea {
    box-sizing: border-box;
    width: 100%;
  }
}
</style>
